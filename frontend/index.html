<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonar Aqua</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sonar-aqua-theme')
          if (t !== 'dark' && t !== 'light') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">Loading Sonar Aqua…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
